[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ppc-next"
version = "11.0.0"
description = "PPC_NEXT - Text-to-Speech & Content Processing Platform"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "N",
    "W",
]
ignore = [
    "E501",
    "E402",
    "E731",
    # Typer 使用函数调用声明 CLI 参数默认值（typer.Argument/Option），
    # B008 与该惯用法冲突，且改写为函数体内赋值会失去 Typer 的自动帮助信息。
    "B008",
    # 抽象基类中提供默认空实现的 hook（如 on_enable / start / stop），
    # 并非必须子类实现的抽象方法，添加 @abstractmethod 会改变接口语义。
    "B027",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
# 注：理想情况下应与 requires-python=">=3.10" 对齐为 "3.10"，
# 但已安装的 numpy pyi stub 使用 PEP 695 `type` 语句（Python 3.12+），
# 在 python_version="3.10" 下会导致 mypy 解析失败。
# 改由 ruff target-version="py310" 在 lint 阶段捕获 3.10 不兼容语法。
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
