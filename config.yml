# PPC9 配置文件 - 终极文本转语音工具
# 版本: 9.0.0
# 冰璃岩开发组 (BLY Team)
# 说明: 所有配置项均带有注释，修改后保存即可生效
# ============================================
# 核心配置
# ============================================
core:
  # 运行模式: parametric | interactive
  mode: parametric
  # 日志级别: debug | info | warning | error
  log_level: info
  # 进度条更新频率（每N个项目更新一次）
  progress_interval: 10
  # 临时文件目录
  temp_dir: ~/.cache/ppc9

# ============================================
# TTS 语音合成配置
# ============================================
tts:
  # 预设配置: speed | balanced | quality | custom
  preset: balanced
  # 语音模型（Azure Neural TTS）
  voice: zh-CN-XiaoxiaoNeural
  # 并发请求数（1-64）
  concurrency: 8
  # 失败重试次数
  retries: 3
  # 超时时间（秒），0表示自动推导
  timeout: 120
  # 超时模式: fixed | auto | adaptive
  timeout_mode: auto
  # 最小超时时间（秒）
  timeout_min: 50
  # 最大超时时间（秒）
  timeout_max: 720
  # 最大分段长度（字符数）
  max_segment_length: 2500
  # 最小分段长度（字符数）
  min_segment_length: 100
  # 是否启用文本分段
  enable_segmentation: true
  # 分段间静音时长（毫秒）
  segment_silence_ms: 100
  # 分段文件名格式（{stem}文件名 {index}序号 {suffix}后缀）
  segment_filename_format: '{stem}_seg_{index:03d}{suffix}'
  # 缓冲区大小
  buffer_size: 32
  # 每秒请求数限制
  rate_limit: 100
  # EMA平滑因子（0.0-1.0）
  ema_alpha: 0.3
  # 快速失败阈值
  fast_fail_threshold: 3
  # 速率恢复延迟（秒）
  rate_recovery_delay: 30.0
  # 隔离区延迟（秒）
  quarantine_delay: 300.0
  # 超时百分位
  timeout_percentile: 0.95
  # API并发数（None表示自动推导）
  api_concurrency: 8
  # 音频速率（如 +40%, -10%）
  rate: +0%

  # 并发预热（规避风控）
  # 启用后从1并发逐步增加到设定并发数，避免瞬间高并发触发风控
  ramp_up_enabled: false
  # 预热持续时间（秒），在此时间内从1逐步增加到设定并发数
  ramp_up_duration: 30.0

  # 文本规范化配置
  text_normalization:
    enable_text_normalization: true
    enable_whitespace_normalization: true
    enable_linebreak_normalization: true
    enable_punctuation_normalization: true
    enable_trim_whitespace: true
    enable_empty_line_normalization: true
    max_consecutive_empty_lines: 2

  # 文本分割标点
  punctuations:
  - '，'
  - '。'
  - '、'
  - '；'
  - '：'
  - '？'
  - '…'
  - '—'
  - '.'
  - '!'
  - '?'
  - ;
  - ','
  - '\n'

# ============================================
# 文本分割配置
# ============================================
split:
  # 章节检测预设: chinese_novel | english_novel | default
  preset: chinese_novel
  # 最小章节长度（字符数）
  min_chapter_length: 100
  # 编码回退列表（按优先级排序）
  encoding_fallback:
  - utf-8
  - gbk
  - gb2312
  # 编码检测缓冲区大小（字节）
  encoding_detect_buffer: 1024
  # 最大文件名长度
  max_filename_length: 100
  # 是否在章节标题后添加"========"分隔符
  # true: 添加分隔符（如"第一章\n========"）
  # false: 不添加分隔符，仅保留标题
  add_title_separator: true
  # 自定义分割规则（JSON数组）
  custom_rules: []

# ============================================
# 批量处理配置
# ============================================
batch:
  # 单批次最大大小（MB）
  max_size_mb: 95
  # 每批次最大文件数
  max_files_per_batch: 500
  # 是否保持文件顺序
  preserve_order: true

# ============================================
# UI 界面配置
# ============================================
ui:
  # UI模式: simple | classic | debug
  mode: simple
  # 详细输出
  verbose: true
  # 禁用颜色
  no_color: false
  # 显示进度条
  show_progress: true
  # 显示时间戳
  show_timestamps: false
  # 日志文件路径（null表示不输出到文件）
  log_file: null

# ============================================
# 功能开关
# ============================================
features:
  # 智能检测
  smart_detection: true
  # 合并短章节
  merge_short_chapters: true
  # 自动重试
  auto_retry: true
  # 保持唤醒
  keep_awake: false

# ============================================
# 性能配置
# ============================================
performance:
  # 内存限制（MB）
  memory_limit_mb: 768
  # 启用内存监控
  enable_memory_monitor: true
  # 启用连接池
  enable_connection_pool: true
  # 连接池大小
  connection_pool_size: 16
  # 最大文件缓存数
  max_file_cache_size: 100
  # 流刷新阈值（字节）
  stream_flush_threshold: 1048576

# ============================================
# 网络配置
# ============================================
network:
  # 探测主机列表
  probe_hosts:
  - azure.microsoft.com
  - cloudflare.com
  # 探测间隔（秒）
  probe_interval: 45
  # 超时时间（秒）
  timeout: 5

# ============================================
# 可靠性配置
# ============================================
reliability:
  tts_retry:
    max_retries: 3
    base_delay: 2.0
    max_delay: 30.0
    exponential_base: 2.0
    jitter: 0.1
  network_retry:
    max_retries: 5
    base_delay: 0.5
    max_delay: 30.0
    exponential_base: 2.0
    jitter: 0.1
  tts_circuit:
    failure_threshold: 5
    half_open_max_calls: 3
    success_threshold: 3
    timeout_seconds: 60.0
    window_seconds: 60.0
  network_circuit:
    failure_threshold: 3
    half_open_max_calls: 3
    success_threshold: 2
    timeout_seconds: 30.0
    window_seconds: 60.0

# ============================================
# 连接池配置
# ============================================
connection_pool:
  adaptive_scaling: true
  connection_validate_interval: 30
  health_check_on_acquire: false
  max_idle_time: 300
  min_idle_connections: 5
  warmup_connections: 10

# ============================================
# 内存池配置
# ============================================
memory_pool:
  compaction_threshold: 0.7
  enable_compaction: true
  generation_count: 3
  old_gen_size: 256
  prefetch_enabled: true
  young_gen_size: 64

# ============================================
# 架构配置
# ============================================
arch:
  big_endian_mode: false
  cache_line_size: 128
  enable_simd: true
  huge_pages: false
  numa_aware: false
  prefetch_distance: 4

# ============================================
# 分布式配置
# ============================================
distributed:
  enabled: false
  adaptive_load_balance:
    decay_factor: 0.9
    enabled: false
    history_weight: 0.5
    history_window_size: 100
    long_text_threshold: 2000
    task_feature_weight: 0.5
  fault_tolerance:
    degradation_threshold: 3
    enable_degradation: true
    enable_task_migration: true
    enabled: true
    migration_delay: 5.0
    recovery_check_interval: 60
  health_check_interval: 30
  health_check_timeout: 5
  load_balance_strategy: round_robin
  local_execution: true
  master_max_concurrency: 8
  max_retries: 3
  mode: master
  node_host: 0.0.0.0
  node_max_concurrency: 4
  node_port: 8000
  nodes: []
  task_timeout: 300

# ============================================
# 扩展配置
# ============================================
extensions:
  auto_load: true
  enabled: true
  extension_dirs:
  - extensions
  strict_validation: true

# 配置版本（自动生成，勿修改）
version: 9.0.0
